# === Oct 6 LATENCY / EXECUTION-COST FINDINGS ===
[latency_2026_10_06]
question = "User asked whether near-zero latency (VPS ~0.1ms vs MT5 85ms / 1334ms) would let exits fill 'in the middle of a spike' and so cut losses."
answer = "NO - the middle of a spike does not exist as a tradeable price. Crash Boom Flip 1000 ticks ONCE PER SECOND and each spike is a SINGLE tick jump. Raw stream around the +$0.30 exit: 13:55:16.054 bid 9581.8713 -> 13:55:17.055 bid 9591.3719 (+9.5006u) -> 13:55:18.054 bid 9591.3644 (-0.0075u). Nothing trades between 9581.87 and 9591.37, so no latency can fill there."
measured_latency_value = "Across all 14 real exit spikes the bid at +100/+250/+500/+1000/+1500 ms differs from the spike tick by less than 0.01u. Trading a 500ms reaction down to 0ms is worth +$0.0079 TOTAL over 14 exits - under one cent."
poll_dominates = "Detection alone costs 0-500ms (mean 250ms) because the executor polls symbol_info_tick every POLL_SECONDS=0.5. That dwarfs the 85-1334ms network latency the user sees. A VPS at ~1-20ms realistic (0.1ms is not credible) would be ~2500x smaller than the poll interval, so it cannot show up in the P/L."
execution_cost_is_fixed = "All 37 live deals checked against the quote at the exact millisecond of each fill: EVERY buy filled +0.2880u ABOVE the touch and EVERY sell +0.2881u BELOW it, with essentially zero variance. Round trip = 0.05 displayed + 0.288 + 0.288 = 0.626u, matching the executor's measured 0.6261u. Execution cost is deterministic, NOT latency-sensitive."
spread_trap = "IMPORTANT for the Oct 8 gate: copy_ticks_range() reports a 0.0500u spread while symbol_info_tick() reports 0.6261u, and the DEALS prove 0.6261 is the real tradeable spread - the tick archive's 0.05u figure is a non-tradeable quote series (offset so the real bid sits near the archive's ask). Any analysis that derives edge from the archive spread will overstate the edge ~12x. The executor is right; do NOT 'fix' it to 0.05, and do not re-litigate the $0.0576/round-trip spread charge."
why_losses_are_large = "Losses come from the spike JUMP, not from execution: a -12u adverse counter-spike moves 0.1 lot by $1.20 in a single tick. No amount of latency recovers that. The only lever is predicting the spike, not racing it."

