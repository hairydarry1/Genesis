<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genesis Spike Catcher</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0a0e17;--bg2:#111827;--bg3:#1f2937;--bg4:#374151;--bdr:#1f2937;--t1:#e5e7eb;--t2:#9ca3af;--t3:#6b7280;--acc:#3b82f6;--grn:#10b981;--red:#ef4444;--yel:#f59e0b;--pur:#8b5cf6;--mono:'JetBrains Mono','Cascadia Code',Consolas,monospace;--sans:system-ui,-apple-system,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--t1);font-family:var(--sans);font-size:12px;overflow:hidden;height:100vh}
.app{display:flex;flex-direction:column;height:100vh}

/* TOPBAR */
.topbar{height:36px;background:var(--bg2);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 12px;gap:4px;flex-shrink:0}
.logo{font-weight:800;font-size:13px;color:var(--acc);margin-right:16px;letter-spacing:1.5px;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.on{background:var(--grn);box-shadow:0 0 8px var(--grn);animation:glow 2s infinite}
.dot.off{background:var(--red)}
@keyframes glow{0%,100%{box-shadow:0 0 4px var(--grn)}50%{box-shadow:0 0 12px var(--grn),0 0 24px rgba(16,185,129,.3)}}
.tab{padding:0 12px;display:flex;align-items:center;gap:6px;cursor:pointer;border-bottom:2px solid transparent;color:var(--t2);font-weight:500;font-size:10px;height:100%;transition:all .15s}
.tab:hover{color:var(--t1);background:rgba(31,41,55,.3)}
.tab.active{background:var(--bg3)}
.tab .sym{font-weight:700}
.tab .px{font-family:var(--mono);font-weight:600;font-size:11px}
.tab .chg{font-size:8px;padding:1px 5px;border-radius:3px;font-weight:600}
.tab .chg.up{background:rgba(16,185,129,.15);color:var(--grn)}
.tab .chg.dn{background:rgba(239,68,68,.15);color:var(--red)}
.spacer{flex:1}
.stats{display:flex;align-items:center;gap:12px;font-size:10px;color:var(--t2)}
.stats b{font-family:var(--mono)}
.clock{font-family:var(--mono);font-weight:600;font-size:11px}

/* LAYOUT BTN */
/layouts{display:flex;gap:2px;background:var(--bg3);border-radius:4px;padding:2px}
.layouts button{width:22px;height:20px;border:none;border-radius:3px;background:transparent;color:var(--t3);font-size:10px;cursor:pointer;transition:all .15s}
.layouts button.on{background:var(--acc);color:#fff}
.layouts button:hover:not(.on){background:var(--bg4);color:var(--t1)}

/* MAIN */
.main{display:grid;grid-template-columns:170px 1fr 250px;grid-template-rows:1fr;gap:1px;background:var(--bdr);flex:1;min-height:0}
.bottom{display:flex;flex-direction:column;height:220px;border-top:1px solid var(--bdr);background:var(--bg)}

/* PANEL */
.panel{background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.phdr{height:26px;background:var(--bg2);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 10px;font-weight:600;font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--t2);gap:6px;flex-shrink:0}
.pbody{flex:1;overflow-y:auto;padding:4px 8px}

/* SYMBOL ROW */
.sym-row{padding:6px 8px;border-bottom:1px solid rgba(31,41,55,.5);cursor:pointer;transition:all .15s;border-left:2px solid transparent}
.sym-row:hover{background:var(--bg3)}
.sym-row.active{background:var(--bg3);border-left-color:var(--acc)}
.sym-row .name{font-weight:700;font-size:11px;margin-bottom:2px}
.sym-row .price{font-family:var(--mono);font-weight:600;font-size:11px;float:right}
.sym-row .meta{display:grid;grid-template-columns:1fr 1fr;gap:1px;font-size:9px;color:var(--t2)}
.sym-row .meta .v{color:var(--t1);font-weight:600;font-family:var(--mono)}
.sym-row .badge{display:inline-block;padding:1px 5px;border-radius:3px;font-size:8px;font-weight:700;margin-top:3px}
.badge.long{background:rgba(16,185,129,.15);color:var(--grn)}
.badge.short{background:rgba(239,68,68,.15);color:var(--red)}
.badge.flat{background:rgba(107,114,128,.1);color:var(--t2)}
.pr{display:flex;justify-content:space-between;padding:2px 0;font-size:10px}
.pr .l{color:var(--t2)}.pr .v{font-weight:600;font-family:var(--mono)}

/* CHART */
.chart-wrap{position:relative;width:100%;height:100%;display:flex;flex-direction:column}
.chart-bar{height:26px;background:var(--bg2);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 6px;gap:4px;flex-shrink:0}
.chart-bar button{padding:1px 6px;border:none;border-radius:2px;font-size:8px;font-weight:500;background:transparent;color:var(--t3);cursor:pointer;transition:all .15s}
.chart-bar button.on{background:var(--acc);color:#fff}
.chart-bar button:hover:not(.on){background:var(--bg4);color:var(--t1)}
.chart-bar .sym-name{font-weight:700;font-size:11px;margin-right:6px}
.chart-bar .ohlc{font-family:var(--mono);font-size:8px;color:var(--t3);margin-left:auto}
.chart-container{flex:1;min-height:0}

/* BRAIN */
.health-score{font-size:24px;font-weight:800;text-align:center;margin:8px 0 2px}
.health-status{text-align:center;font-size:9px;color:var(--t2);text-transform:uppercase;margin-bottom:6px}
.health-bar{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin:0 8px 8px}
.health-bar .fill{height:100%;border-radius:2px;transition:width .5s}
.card{background:var(--bg3);border-radius:4px;padding:6px 8px;margin-top:4px;border-left:3px solid var(--acc)}
.learn-card{border-left-color:var(--yel);margin-bottom:4px}
.learn-time{font-size:8px;color:var(--yel)}
.learn-text{font-size:9px;font-style:italic;color:var(--t1);line-height:1.4}
.learn-action{font-size:8px;color:var(--t3)}

/* BOTTOM */
.btabs{display:flex;height:24px;background:var(--bg2);border-bottom:1px solid var(--bdr);padding:0 8px;flex-shrink:0}
.bt{padding:0 12px;display:flex;align-items:center;cursor:pointer;color:var(--t2);font-size:9px;font-weight:500;border-bottom:2px solid transparent;transition:all .15s}
.bt:hover{color:var(--t1)}.bt.active{color:var(--acc);border-bottom-color:var(--acc)}
.bcontent{flex:1;overflow:auto}
.bcontent>div{display:none}.bcontent>div.active{display:block}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:9px}
th{text-align:left;padding:3px 8px;color:var(--t3);font-weight:500;font-family:var(--sans);border-bottom:1px solid var(--bdr);position:sticky;top:0;background:var(--bg2);font-size:8px;text-transform:uppercase}
td{padding:3px 8px;border-bottom:1px solid rgba(31,41,55,.3)}
tr:hover td{background:var(--bg3)}
.cat{display:inline-block;padding:1px 5px;border-radius:3px;font-size:7px;font-weight:600;text-transform:uppercase}
.cat.good_fade{background:rgba(16,185,129,.15);color:var(--grn)}
.cat.late_entry{background:rgba(239,68,68,.15);color:var(--red)}
.cat.safety_spike{background:rgba(245,158,11,.15);color:var(--yel)}
.cat.unknown{background:rgba(107,114,128,.1);color:var(--t2)}
.empty{padding:20px;text-align:center;color:var(--t3);font-size:10px}

/* GRID LAYOUTS */
.grid-1{display:grid;grid-template-columns:1fr;grid-template-rows:1fr;height:100%}
.grid-2{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr;height:100%;gap:1px}
.grid-3l{display:grid;grid-template-columns:1.5fr 1fr;grid-template-rows:1fr 1fr;height:100%;gap:1px}
.grid-3r{display:grid;grid-template-columns:1fr 1.5fr;grid-template-rows:1fr 1fr;height:100%;gap:1px}
.grid-4{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;height:100%;gap:1px}

::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}
</style>
</head>
<body>
<div class="app">
  <!-- TOPBAR -->
  <div class="topbar">
    <div class="logo">⚡ GENESIS <span class="dot off" id="connDot"></span></div>
    <div id="tabs"></div>
    <div class="spacer"></div>
    <div class="layouts" id="layouts"></div>
    <div class="stats">
      <span>Trades <b id="statTrades">0</b></span>
      <span>PnL <b id="statPnl" style="color:var(--grn)">+$0.00</b></span>
      <span>WR <b id="statWr">0%</b></span>
      <span class="clock" id="clock">--:--:--</span>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <!-- SYMBOLS -->
    <div class="panel">
      <div class="phdr">📊 Market Watch</div>
      <div class="pbody" id="symPanel"></div>
    </div>

    <!-- CHART -->
    <div class="panel" style="position:relative">
      <div id="chartArea" class="grid-1"></div>
    </div>

    <!-- BRAIN -->
    <div class="panel">
      <div class="phdr">🧠 Strategy Brain</div>
      <div class="pbody" id="brainPanel">
        <div class="health-score" id="brainScore" style="color:var(--yel)">50%</div>
        <div class="health-status" id="brainStatus">LEARNING</div>
        <div class="health-bar"><div class="fill" id="brainBar" style="width:50%;background:var(--yel)"></div></div>
        <div id="brainLearnings"></div>
      </div>
    </div>
  </div>

  <!-- BOTTOM -->
  <div class="bottom">
    <div class="btabs">
      <div class="bt active" data-tab="trades">TRADES</div>
      <div class="bt" data-tab="postmortem">POST-MORTEM</div>
      <div class="bt" data-tab="safety">SAFETY</div>
    </div>
    <div class="bcontent">
      <div id="tab-trades" class="active">
        <table><thead><tr><th>#</th><th>Time</th><th>Symbol</th><th>Event</th><th>P&L</th><th>Category</th></tr></thead>
        <tbody id="tradesBody"></tbody></table>
      </div>
      <div id="tab-postmortem">
        <table><thead><tr><th>Category</th><th>Trades</th><th>WR</th><th>P&L</th></tr></thead>
        <tbody id="postBody"></tbody></table>
      </div>
      <div id="tab-safety">
        <table><thead><tr><th>#</th><th>Time</th><th>Symbol</th><th>Full Loss</th><th>Actual</th><th>Saved</th></tr></thead>
        <tbody id="safetyBody"></tbody></table>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================
// GENESIS SPIKE CATCHER — Vanilla JS Dashboard
// No React, no Zustand, no build step. Just works.
// ============================================================

const SYMBOLS = ['BOOM500','CRASH500','BOOM1000','CRASH1000'];
const SYM_CFG = {
  BOOM500:  {short:'BOOM',   color:'#3b82f6', digits:3, base:4697.4},
  CRASH500: {short:'CRASH',  color:'#10b981', digits:3, base:3042.1},
  BOOM1000: {short:'BOOM1K', color:'#f59e0b', digits:4, base:15102.3},
  CRASH1000:{short:'CRASH1K',color:'#8b5cf6', digits:4, base:6089.2},
};

const LAYOUTS = [
  {id:'1', icon:'▣', grid:'grid-1', cells:1},
  {id:'2', icon:'▥', grid:'grid-2', cells:2},
  {id:'3l',icon:'▦', grid:'grid-3l',cells:3},
  {id:'4', icon:'⊞', grid:'grid-4', cells:4},
];

let activeSym = 'BOOM500';
let layout = '1';
let charts = {};
let candleSeries = {};
let markerSeries = {};
let ws = null;
let symState = {};
let tradeEvents = [];
let equityCurves = {};
let categoryReports = {};
let safetyExits = [];

// ── INIT ────────────────────────────────────────────────────
function init() {
  SYMBOLS.forEach(s => {
    symState[s] = {price:SYM_CFG[s].base, equity:10000, pnl:0, trades:0, wins:0, position:'FLAT', returnPct:0};
    equityCurves[s] = [];
    categoryReports[s] = {};
  });
  renderTabs();
  renderSymPanel();
  renderLayouts();
  switchLayout('1');
  connectWS();
  setInterval(() => {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US',{hour12:false});
  }, 1000);
}

// ── WEBSOCKET ───────────────────────────────────────────────
function connectWS() {
  ws = new WebSocket('ws://'+location.hostname+':8766');
  ws.onopen = () => {
    document.getElementById('connDot').className = 'dot on';
    console.log('[WS] Connected');
  };
  ws.onmessage = (e) => {
    try { handleEvent(JSON.parse(e.data)); } catch(err) {}
  };
  ws.onclose = () => {
    document.getElementById('connDot').className = 'dot off';
    setTimeout(connectWS, 3000);
  };
  ws.onerror = () => ws.close();
}

function handleEvent(msg) {
  switch(msg.type) {
    case 'init':
      if(msg.symbols) Object.entries(msg.symbols).forEach(([s,d]) => {
        if(symState[s]) Object.assign(symState[s], d);
      });
      // Store candles for loading after charts are created
      if(msg.candles) {
        Object.entries(msg.candles).forEach(([s,candles]) => {
          window._pendingCandles = window._pendingCandles || {};
          window._pendingCandles[s] = candles;
        });
      }
      renderSymPanel();
      updateTabs();
      updateStats();
      // Load candles after charts are ready
      setTimeout(() => {
        if(window._pendingCandles) {
          Object.entries(window._pendingCandles).forEach(([s,candles]) => {
            if(candleSeries[s] && candles) {
              candleSeries[s].setData(candles.map(c=>({time:c.time,open:c.open,high:c.high,low:c.low,close:c.close})));
              charts[s]?.timeScale().fitContent();
            }
          });
          window._pendingCandles = null;
        }
      }, 500);
      break;

    case 'tick':
      if(symState[msg.symbol]) {
        symState[msg.symbol].price = msg.price;
        renderSymPanel();
        updateTabs();
      }
      break;

    case 'candles':
      if(msg.symbol && msg.candles) {
        if(candleSeries[msg.symbol]) {
          candleSeries[msg.symbol].setData(msg.candles.map(c=>({time:c.time,open:c.open,high:c.high,low:c.low,close:c.close})));
          charts[msg.symbol]?.timeScale().fitContent();
        } else {
          // Chart not ready yet, store for later
          window._pendingCandles = window._pendingCandles || {};
          window._pendingCandles[msg.symbol] = msg.candles;
        }
      }
      break;

    case 'candle':
      if(candleSeries[msg.symbol] && msg.candle) {
        const c = msg.candle;
        candleSeries[msg.symbol].update({time:c.time,open:c.open,high:c.high,low:c.low,close:c.close});
      }
      break;

    case 'open':
      tradeEvents.unshift({type:'open',symbol:msg.symbol,time:new Date().toLocaleTimeString(),side:msg.direction===1?'LONG':'SHORT',entry:msg.entry_price});
      addMarker(msg.symbol, msg.direction===1?'belowBar':'aboveBar', msg.direction===1?'#10b981':'#ef4444', msg.direction===1?'arrowUp':'arrowDown', '');
      renderTrades();
      break;

    case 'close':
      tradeEvents.unshift({type:'close',symbol:msg.symbol,time:new Date().toLocaleTimeString(),pnl:msg.pnl,reason:msg.exit_reason,category:msg.category});
      if(msg.pnl>0) symState[msg.symbol].wins++;
      symState[msg.symbol].trades++;
      symState[msg.symbol].pnl += msg.pnl;
      symState[msg.symbol].equity = msg.equity;
      symState[msg.symbol].position = 'FLAT';
      symState[msg.symbol].returnPct = ((msg.equity/10000)-1)*100;
      equityCurves[msg.symbol].push({equity:msg.equity,pnl:msg.pnl});
      const cat = msg.category||'unknown';
      if(!categoryReports[msg.symbol][cat]) categoryReports[msg.symbol][cat]={trades:0,wins:0,pnl:0};
      categoryReports[msg.symbol][cat].trades++;
      if(msg.pnl>0) categoryReports[msg.symbol][cat].wins++;
      categoryReports[msg.symbol][cat].pnl+=msg.pnl;
      addMarker(msg.symbol,'aboveBar',msg.pnl>0?'#10b981':'#ef4444','circle',msg.pnl>0?'✓':'✗');
      renderSymPanel();
      renderTrades();
      renderPostMortem();
      updateStats();
      break;

    case 'safety_exit':
      safetyExits.push({time:new Date().toLocaleTimeString(),symbol:msg.symbol,full:msg.pnl+msg.saved,actual:msg.pnl,saved:msg.saved});
      addMarker(msg.symbol,'aboveBar','#f59e0b','square','⚡');
      renderSafety();
      break;

    case 'spike':
      if(symState[msg.symbol]) symState[msg.symbol].spikeCount = (symState[msg.symbol].spikeCount||0)+1;
      break;

    case 'status':
      if(symState[msg.symbol]) {
        symState[msg.symbol].equity = msg.equity;
        symState[msg.symbol].position = msg.position;
        symState[msg.symbol].trades = msg.trades;
        renderSymPanel();
        updateStats();
      }
      break;
  }
}

function addMarker(sym, pos, color, shape, text) {
  if(!markerSeries[sym]) return;
  const markers = markerSeries[sym].markers().slice(-30);
  const now = Math.floor(Date.now()/1000);
  // Deduplicate by rounding to minute
  const rounded = Math.floor(now/60)*60;
  const existing = markers.find(m => Math.abs(m.time-rounded)<60);
  if(!existing) {
    markers.push({time:rounded, position:pos, color:color, shape:shape, text:text});
  }
  markerSeries[sym].setMarkers(markers.sort((a,b)=>a.time-b.time));
}

// ── CHARTS ──────────────────────────────────────────────────
function createChart(sym, container) {
  const chart = LightweightCharts.createChart(container, {
    layout:{background:{color:'#0a0e17'},textColor:'#9ca3af',fontSize:10},
    grid:{vertLines:{color:'#111827'},horzLines:{color:'#111827'}},
    crosshair:{mode:0},
    rightPriceScale:{borderColor:'#1f2937'},
    timeScale:{borderColor:'#1f2937',timeVisible:true},
  });
  const cs = chart.addCandlestickSeries({
    upColor:'#10b981',downColor:'#ef4444',
    borderUpColor:'#10b981',borderDownColor:'#ef4444',
    wickUpColor:'#10b981',wickDownColor:'#ef4444',
  });
  charts[sym] = chart;
  candleSeries[sym] = cs;

  // Markers series (using the same series for markers)
  markerSeries[sym] = cs;

  // Resize
  new ResizeObserver(entries => {
    for(const e of entries) {
      if(e.contentRect.width>0 && e.contentRect.height>0) {
        chart.applyOptions({width:e.contentRect.width,height:e.contentRect.height});
      }
    }
  }).observe(container);

  // Crosshair
  chart.subscribeCrosshairMove(p => {
    const el = container.closest('.chart-wrap')?.querySelector('.ohlc');
    if(!el) return;
    if(!p.time||!p.seriesData) {el.textContent='';return;}
    const d = p.seriesData.get(cs);
    if(d) el.textContent=`O ${d.open.toFixed(SYM_CFG[sym].digits)} H ${d.high.toFixed(SYM_CFG[sym].digits)} L ${d.low.toFixed(SYM_CFG[sym].digits)} C ${d.close.toFixed(SYM_CFG[sym].digits)}`;
  });
}

// ── LAYOUT ──────────────────────────────────────────────────
function renderLayouts() {
  const el = document.getElementById('layouts');
  el.innerHTML = LAYOUTS.map(l => `<button class="${l.id===layout?'on':''}" onclick="switchLayout('${l.id}')" title="${l.id}">${l.icon}</button>`).join('');
}

function switchLayout(id) {
  layout = id;
  renderLayouts();
  const cfg = LAYOUTS.find(l=>l.id===id);
  const area = document.getElementById('chartArea');
  area.className = cfg.grid;
  area.innerHTML = '';

  const symsToShow = SYMBOLS.slice(0, cfg.cells);
  symsToShow.forEach((sym,i) => {
    const wrap = document.createElement('div');
    wrap.className = 'chart-wrap';
    wrap.style.background = 'var(--bg)';
    wrap.innerHTML = `
      <div class="chart-bar">
        <span class="sym-name" style="color:${SYM_CFG[sym].color}">${SYM_CFG[sym].short}</span>
        <span class="ohlc" id="ohlc-${sym}"></span>
      </div>
      <div class="chart-container" id="chart-${sym}"></div>
    `;
    area.appendChild(wrap);

    // Create chart after DOM is ready, then load pending candles
    requestAnimationFrame(() => {
      const container = document.getElementById('chart-'+sym);
      if(container && !charts[sym]) {
        createChart(sym, container);
      }
      // Load any pending candles for this symbol
      if(window._pendingCandles && window._pendingCandles[sym] && candleSeries[sym]) {
        candleSeries[sym].setData(window._pendingCandles[sym].map(c=>({time:c.time,open:c.open,high:c.high,low:c.low,close:c.close})));
        charts[sym]?.timeScale().fitContent();
        delete window._pendingCandles[sym];
      }
    });
  });

  // Click symbol in tabs to switch active
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      activeSym = t.dataset.sym;
      updateTabs();
      renderSymPanel();
    };
  });
}

// ── TABS ────────────────────────────────────────────────────
function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = SYMBOLS.map(s => {
    const cfg = SYM_CFG[s];
    const st = symState[s];
    return `<div class="tab ${s===activeSym?'active':''}" data-sym="${s}">
      <span class="sym" style="color:${cfg.color}">${cfg.short}</span>
      <span class="px">${st.price.toFixed(cfg.digits)}</span>
      <span class="chg ${st.pnl>=0?'up':'dn'}">${st.pnl>=0?'+':''}${st.pnl.toFixed(2)}</span>
    </div>`;
  }).join('');
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      activeSym = t.dataset.sym;
      updateTabs();
      renderSymPanel();
    };
  });
}

function updateTabs() {
  document.querySelectorAll('.tab').forEach(t => {
    const s = t.dataset.sym;
    const st = symState[s];
    t.className = `tab ${s===activeSym?'active':''}`;
    t.querySelector('.px').textContent = st.price.toFixed(SYM_CFG[s].digits);
    const chg = t.querySelector('.chg');
    chg.textContent = `${st.pnl>=0?'+':''}${st.pnl.toFixed(2)}`;
    chg.className = `chg ${st.pnl>=0?'up':'dn'}`;
  });
}

// ── SYMBOL PANEL ────────────────────────────────────────────
function renderSymPanel() {
  const el = document.getElementById('symPanel');
  el.innerHTML = SYMBOLS.map(s => {
    const cfg = SYM_CFG[s];
    const st = symState[s];
    const wr = st.trades>0?((st.wins/st.trades)*100).toFixed(0):'0';
    return `<div class="sym-row ${s===activeSym?'active':''}" onclick="activeSym='${s}';renderTabs();renderSymPanel()">
      <div class="name" style="color:${cfg.color}">${cfg.short}<span class="price" style="color:${cfg.color}">${st.price.toFixed(cfg.digits)}</span></div>
      <div class="meta">
        <div>Equity <span class="v">$${st.equity.toFixed(0)}</span></div>
        <div>Return <span class="v" style="color:${st.returnPct>=0?'var(--grn)':'var(--red)'}">${st.returnPct.toFixed(2)}%</span></div>
        <div>Trades <span class="v">${st.trades}</span></div>
        <div>WR <span class="v">${wr}%</span></div>
        <div>PnL <span class="v" style="color:${st.pnl>=0?'var(--grn)':'var(--red)'}">${st.pnl>=0?'+':''}$${st.pnl.toFixed(2)}</span></div>
      </div>
      <span class="badge ${st.position.toLowerCase()}">${st.position}</span>
    </div>`;
  }).join('');
}

// ── BRAIN PANEL ─────────────────────────────────────────────
function updateBrain() {
  const st = symState[activeSym];
  if(!st) return;
  const wr = st.trades>0?(st.wins/st.trades):0.5;
  const score = Math.min(wr, 1);
  const status = score>=0.7?'HEALTHY':score>=0.4?'CAUTION':'CRITICAL';
  const color = score>=0.7?'var(--grn)':score>=0.4?'var(--yel)':'var(--red)';
  document.getElementById('brainScore').textContent = (score*100).toFixed(0)+'%';
  document.getElementById('brainScore').style.color = color;
  document.getElementById('brainStatus').textContent = status;
  document.getElementById('brainBar').style.width = (score*100)+'%';
  document.getElementById('brainBar').style.background = color;
}

// ── STATS ───────────────────────────────────────────────────
function updateStats() {
  let totalTrades=0, totalWins=0, totalPnl=0;
  SYMBOLS.forEach(s => {
    totalTrades += symState[s].trades;
    totalWins += symState[s].wins;
    totalPnl += symState[s].pnl;
  });
  const wr = totalTrades>0?((totalWins/totalTrades)*100).toFixed(0):'0';
  document.getElementById('statTrades').textContent = totalTrades;
  const pnlEl = document.getElementById('statPnl');
  pnlEl.textContent = `${totalPnl>=0?'+':''}$${totalPnl.toFixed(2)}`;
  pnlEl.style.color = totalPnl>=0?'var(--grn)':'var(--red)';
  document.getElementById('statWr').textContent = wr+'%';
  updateBrain();
}

// ── BOTTOM TABS ─────────────────────────────────────────────
document.querySelectorAll('.bt').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.bt').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.bcontent>div').forEach(d=>d.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('tab-'+t.dataset.tab).classList.add('active');
  };
});

function renderTrades() {
  const el = document.getElementById('tradesBody');
  el.innerHTML = tradeEvents.slice(0,30).map((t,i) => {
    if(t.type==='open') {
      return `<tr><td>${i+1}</td><td>${t.time}</td><td style="font-weight:700;color:var(--acc)">${SYM_CFG[t.symbol]?.short||t.symbol}</td>
        <td style="color:${t.side==='LONG'?'var(--grn)':'var(--red)'}">${t.side} @ ${(t.entry||0).toFixed(3)}</td>
        <td>---</td><td></td></tr>`;
    }
    return `<tr><td>${i+1}</td><td>${t.time}</td><td style="font-weight:700;color:var(--acc)">${SYM_CFG[t.symbol]?.short||t.symbol}</td>
      <td>${(t.reason||'').toUpperCase()}</td>
      <td style="font-weight:600;color:${t.pnl>=0?'var(--grn)':'var(--red)'}">${t.pnl>=0?'+':''}$${(t.pnl||0).toFixed(4)}</td>
      <td><span class="cat ${t.category||''}">${t.category||''}</span></td></tr>`;
  }).join('');
}

function renderPostMortem() {
  const el = document.getElementById('postBody');
  const report = categoryReports[activeSym]||{};
  el.innerHTML = Object.entries(report).sort((a,b)=>b[1].pnl-a[1].pnl).map(([cat,d]) => {
    const wr = d.trades>0?((d.wins/d.trades)*100).toFixed(0):'0';
    return `<tr><td><span class="cat ${cat}">${cat}</span></td><td>${d.trades}</td>
      <td style="color:${wr>=55?'var(--grn)':'var(--red)'}">${wr}%</td>
      <td style="font-weight:600;color:${d.pnl>=0?'var(--grn)':'var(--red)'}">${d.pnl>=0?'+':''}$${d.pnl.toFixed(4)}</td></tr>`;
  }).join('') || '<tr><td colspan="4" style="padding:12px;color:var(--t3);text-align:center">No data yet</td></tr>';
}

function renderSafety() {
  const el = document.getElementById('safetyBody');
  el.innerHTML = safetyExits.slice(0,20).map((e,i) => {
    return `<tr><td>${i+1}</td><td>${e.time}</td><td style="font-weight:700;color:var(--yel)">${SYM_CFG[e.symbol]?.short||e.symbol}</td>
      <td style="color:var(--red)">$${e.full.toFixed(4)}</td>
      <td style="color:var(--yel)">$${e.actual.toFixed(4)}</td>
      <td style="color:var(--grn);font-weight:600">$${e.saved.toFixed(4)}</td></tr>`;
  }).join('') || '<tr><td colspan="6" style="padding:12px;color:var(--t3);text-align:center">No safety exits yet</td></tr>';
}

// ── START ───────────────────────────────────────────────────
init();
</script>
</body>
</html>
